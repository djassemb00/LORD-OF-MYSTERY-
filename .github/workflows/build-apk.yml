name: Build Android APK

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "25.2.9519653"

jobs:
  build-apk:
    name: Build Veloren Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          set -x
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          # Accept licenses and install required packages
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${{ env.NDK_VERSION }}"

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

          # Add NDK clang to PATH
          NDK_CLANG="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$NDK_CLANG" >> $GITHUB_PATH
          echo "NDK_CLANG=$NDK_CLANG" >> $GITHUB_ENV

          # Verify
          echo "Checking NDK installation..."
          ls -la "$NDK_CLANG" | head -20
          which aarch64-linux-android21-clang || echo "clang not found in PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            veloren-android/app/src/main/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('veloren-android/app/src/main/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust for Android
        working-directory: veloren-android/app/src/main/rust
        env:
          VELOREN_GIT_VERSION: "android/0/0"
          RUSTFLAGS: "-C debuginfo=0"
          CC_aarch64_linux_android: ${{ env.NDK_CLANG }}/aarch64-linux-android21-clang
          CC_armv7_linux_androideabi: ${{ env.NDK_CLANG }}/armv7a-linux-androideabi21-clang
          AR_aarch64_linux_android: ${{ env.NDK_CLANG }}/llvm-ar
          AR_armv7_linux_androideabi: ${{ env.NDK_CLANG }}/llvm-ar
        run: |
          echo "=== Build Environment ==="
          rustc --version
          cargo --version
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "NDK_CLANG=$NDK_CLANG"
          echo "CC_aarch64_linux_android=$CC_aarch64_linux_android"
          echo "========================="

          echo "Building aarch64-linux-android..."
          cargo build --target aarch64-linux-android --release 2>&1 || {
            echo "FAILED: aarch64 build"
            exit 1
          }

          echo "Building armv7-linux-androideabi..."
          cargo build --target armv7-linux-androideabi --release 2>&1 || {
            echo "FAILED: armv7 build"
            exit 1
          }

      - name: Copy native libs to jniLibs
        run: |
          mkdir -p veloren-android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a}

          cp veloren-android/app/src/main/rust/target/aarch64-linux-android/release/libveloren_android.so \
             veloren-android/app/src/main/jniLibs/arm64-v8a/

          cp veloren-android/app/src/main/rust/target/armv7-linux-androideabi/release/libveloren_android.so \
             veloren-android/app/src/main/jniLibs/armeabi-v7a/

          ls -lh veloren-android/app/src/main/jniLibs/*/

      - name: Build APK
        working-directory: veloren-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug.apk
          path: veloren-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: build-logs
          path: |
            veloren-android/app/build/outputs/logs/
            veloren-android/app/src/main/rust/target/*/release/build/*/output
          retention-days: 7
