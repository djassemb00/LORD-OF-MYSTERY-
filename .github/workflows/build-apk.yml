name: Build Android APK

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "25.2.9519653"

jobs:
  build-apk:
    name: Build Veloren Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            veloren-android/app/src/main/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('veloren-android/app/src/main/rust/Cargo.lock') }}

      - name: Debug environment
        run: |
          echo "ANDROID_HOME=${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "PATH=$PATH"
          which aarch64-linux-android21-clang || echo "clang not found"
          rustc --version
          cargo --version
          rustup target list --installed

      - name: Build Rust aarch64
        working-directory: veloren-android/app/src/main/rust
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo build --target aarch64-linux-android --release

      - name: Build Rust armv7
        working-directory: veloren-android/app/src/main/rust
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo build --target armv7-linux-androideabi --release

      - name: Copy libs
        run: |
          mkdir -p veloren-android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a}
          cp veloren-android/app/src/main/rust/target/aarch64-linux-android/release/libveloren_android.so veloren-android/app/src/main/jniLibs/arm64-v8a/
          cp veloren-android/app/src/main/rust/target/armv7-linux-androideabi/release/libveloren_android.so veloren-android/app/src/main/jniLibs/armeabi-v7a/

      - name: Build APK
        working-directory: veloren-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug.apk
          path: veloren-android/app/build/outputs/apk/debug/app-debug.apk
