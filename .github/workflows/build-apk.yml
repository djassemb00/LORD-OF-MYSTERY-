name: Build Android APK

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "25.2.9519653"

jobs:
  build-apk:
    name: Build Veloren Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('veloren-android/app/src/main/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('veloren-android/app/src/main/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: veloren-android/app/src/main/rust/target
          key: ${{ runner.os }}-rust-target-${{ hashFiles('veloren-android/app/src/main/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-target-

      - name: Build Rust library for Android
        working-directory: veloren-android/app/src/main/rust
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          VELOREN_GIT_VERSION: "android/0/0"
          RUSTFLAGS: "-C debuginfo=0"
        run: |
          echo "NDK_HOME=$NDK_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "Building for aarch64-linux-android..."
          cargo build --target aarch64-linux-android --release 2>&1

          echo "Building for armv7-linux-androideabi..."
          cargo build --target armv7-linux-androideabi --release 2>&1

      - name: Copy native libraries to jniLibs
        run: |
          mkdir -p veloren-android/app/src/main/jniLibs/arm64-v8a
          mkdir -p veloren-android/app/src/main/jniLibs/armeabi-v7a

          cp veloren-android/app/src/main/rust/target/aarch64-linux-android/release/libveloren_android.so \
             veloren-android/app/src/main/jniLibs/arm64-v8a/

          cp veloren-android/app/src/main/rust/target/armv7-linux-androideabi/release/libveloren_android.so \
             veloren-android/app/src/main/jniLibs/armeabi-v7a/

          echo "Native libraries copied successfully"

      - name: Make gradlew executable
        run: chmod +x veloren-android/gradlew

      - name: Build Android APK (Debug)
        working-directory: veloren-android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: veloren-android-debug-apk
          path: veloren-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            veloren-android/app/build/outputs/logs/
            veloren-android/app/src/main/rust/target/*/release/.fingerprint/
          retention-days: 7
