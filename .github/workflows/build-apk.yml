name: Build Android APK

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # تشغيل يدوي

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "26.2.11394342"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.2.11394342'

      - name: Set NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            veloren-android/app/src/main/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('veloren-android/app/src/main/rust/Cargo.lock') }}

      - name: Environment check
        run: |
          echo "NDK: ${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          rustc --version && cargo --version
          rustup target list --installed

      - name: Build Rust aarch64
        working-directory: veloren-android/app/src/main/rust
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          CC_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
        run: cargo build --target aarch64-linux-android --release -vv

      - name: Build Rust armv7
        working-directory: veloren-android/app/src/main/rust
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          CC_armv7_linux_androideabi: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi29-clang
        run: cargo build --target armv7-linux-androideabi --release -vv || echo "armv7 build skipped"

      - name: Copy libs
        run: |
          mkdir -p veloren-android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a}
          cp veloren-android/app/src/main/rust/target/aarch64-linux-android/release/libveloren_android.so veloren-android/app/src/main/jniLibs/arm64-v8a/ || echo "aarch64 lib not found"
          cp veloren-android/app/src/main/rust/target/armv7-linux-androideabi/release/libveloren_android.so veloren-android/app/src/main/jniLibs/armeabi-v7a/ || echo "armv7 lib not found"

      - name: Build APK
        working-directory: veloren-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: veloren-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build Release APK
        working-directory: veloren-android
        run: |
          ./gradlew assembleRelease --no-daemon || echo "Release build failed (no signing)"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned.apk
          path: veloren-android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
