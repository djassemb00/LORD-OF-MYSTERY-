name: Build Lord of Mystery Gacha APK

permissions:
  issues: write

on:
  push:
    branches: ["**"]
    paths:
      - "lord-of-mystery-gacha/**"
      - ".github/workflows/build-lord-gacha.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Build Debug APK
        working-directory: lord-of-mystery-gacha
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace > gradle-output.log 2>&1 || { tail -120 gradle-output.log; exit 1; }

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: lord-of-mystery-gacha/gradle-output.log
          if-no-files-found: ignore

      - name: Report build failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERRORS=$(grep -E "^e: |error:" lord-of-mystery-gacha/gradle-output.log | head -30)
          gh issue create --title "Build failed: ${{ github.sha }}" --body "Kotlin errors:
          \`\`\`
          $ERRORS
          \`\`\`" || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lord-of-mystery-gacha-debug.apk
          path: lord-of-mystery-gacha/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Summary
        if: always()
        run: |
          echo "## 📦 Lord of Mystery Gacha — Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "lord-of-mystery-gacha/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ **Debug APK:** Built successfully" >> $GITHUB_STEP_SUMMARY
            APK_SIZE=$(du -h lord-of-mystery-gacha/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "📏 **Size:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Debug APK:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
