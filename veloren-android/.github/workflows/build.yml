name: Android Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable
  NDK_VERSION: 25.2.9519653

jobs:
  build-rust:
    name: Build Rust Library
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: app/src/main/rust

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Build Rust for arm64-v8a
      working-directory: app/src/main/rust
      run: |
        cargo ndk -t arm64-v8a --platform 29 build --release

    - name: Build Rust for armeabi-v7a
      working-directory: app/src/main/rust
      run: |
        cargo ndk -t armeabi-v7a --platform 29 build --release

    - name: Copy libraries to jniLibs
      working-directory: .
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        mkdir -p app/src/main/jniLibs/armeabi-v7a
        cp app/src/main/rust/target/aarch64-linux-android/release/libveloren_android.so \
           app/src/main/jniLibs/arm64-v8a/
        cp app/src/main/rust/target/armv7-linux-androideabi/release/libveloren_android.so \
           app/src/main/jniLibs/armeabi-v7a/

    - name: Upload Rust libraries
      uses: actions/upload-artifact@v4
      with:
        name: rust-libs
        path: |
          app/src/main/jniLibs/
        retention-days: 1

  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    needs: build-rust

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Rust libraries
      uses: actions/download-artifact@v4
      with:
        name: rust-libs
        path: app/src/main/jniLibs/

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager "ndk;25.2.9519653"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make Gradle executable
      working-directory: .
      run: chmod +x gradlew

    - name: Build Debug APK
      working-directory: .
      run: |
        ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: veloren-android-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14

    - name: Build Release APK
      working-directory: .
      run: |
        ./gradlew assembleRelease --stacktrace || echo "Release build may fail without signing config"

    - name: Upload Release APK (if built)
      uses: actions/upload-artifact@v4
      if: hashFiles('app/build/outputs/apk/release/app-release-unsigned.apk') != ''
      with:
        name: veloren-android-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 14

  lint:
    name: Code Linting
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: app/src/main/rust

    - name: Run Rust linter (clippy)
      working-directory: app/src/main/rust
      run: |
        cargo clippy --target aarch64-linux-android -- -D warnings || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Run Android Lint
      working-directory: .
      run: |
        ./gradlew lintDebug || true

    - name: Upload Lint Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-report
        path: veloren-android/app/build/reports/lint-results-debug.html
        retention-days: 7
