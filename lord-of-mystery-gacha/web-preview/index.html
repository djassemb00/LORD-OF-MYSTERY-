  .card-row{display:flex;gap:10px;background:var(--panel);border-radius:10px;padding:10px;margin:6px 0;cursor:pointer;border-right:6px solid #999;animation:fadein .4s}
  .card-row:hover{border-color:var(--gold)}

  .cell{background:var(--panel);border-radius:10px;padding:10px;cursor:pointer}

  .choice{background:#241c45;color:var(--text);border:1px solid #3a2d6b;border-radius:10px;padding:12px;width:100%;text-align:right;cursor:pointer;margin:5px 0;font-size:15px}

  .stars{color:var(--gold)}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;padding:10px 18px;border-radius:20px;font-weight:bold;z-index:30;display:none}

function save(){localStorage.setItem('lotm_save',JSON.stringify(S))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function header(){document.getElementById('h-essence').textContent='💎 '+S.essence;document.getElementById('h-coins').textContent='🪙 '+S.coins;document.getElementById('h-level').textContent='⭐ Lv.'+S.level}
function modal(html){document.getElementById('modal-box').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function today(){return new Date().toISOString().slice(0,10)}
function questProg(id){if(S.questDate!==today()){S.questDate=today();S.quests={};save()}return S.quests[id]||0}
function questDone(id,amt=1){const q=QUESTS.find(x=>x.id===id);if(!q)return;const before=questProg(id);if(before>=q.target)return;const after=Math.min(q.target,before+amt);S.quests[id]=after;if(after>=q.target&&before<q.target){S.essence+=q.ess;S.coins+=q.coins;toast(`🎯 مهمة مكتملة: ${q.t} (+${q.ess} جوهر +${q.coins} عملة)`);header()}save()}
function cardLevel(id){return S.levels[id]||1}
function leveled(c){const lv=cardLevel(c.id);if(lv<=1)return c;const m=1+(lv-1)*0.15;return{...c,a:Math.floor(c.a*m),d:Math.floor(c.d*m),h:Math.floor(c.h*m)}}

// ================= AI (Pollinations free + local fallback) =================
const LOCAL_LINES=['الضباب الرمادي يتحرك حولك كأن العالم نفسه يراقبك. تشعر أن كل خطوة تخطوها تغيّر شيئاً في هذا العالم الغامض.','في مكان ما بعيد، يبتسم الأحمق خلف حجاب الغموض. مصيرك يتشكل الآن، وكل اختيار تفعله يترك أثراً.','الرياح تحمل همسات من الماضي. تسمع صوتاً يقول إن الطريق أمامك طويل، لكن من يملك الشجاعة يصل إلى النهاية.','تشعر بقوة روحانية تسري في جسدك. العالم من حولك يتغير ببطء، وكل شيء يبدو ممكناً الآن.','من بعيد، ترى نوراً خافتاً. إنه نور الأمل في عالم مليء بالظلام والأسرار.'];
function localNarrate(p){return LOCAL_LINES[Math.abs(p.split('').reduce((a,c)=>a+c.charCodeAt(0),0))%LOCAL_LINES.length]}
async function aiNarrate(prompt){
  if(S.aiProvider==='local')return{text:localNarrate(prompt),fromAi:false};
  try{
    if(S.aiProvider==='pollinations'){
      const full=encodeURIComponent('أنت راوي لعبة مستوحاة من رواية لورد الغامض. اكتب بالعربية بأسلوب غامض ومشوق (3-5 جمل). '+prompt);
      const r=await fetch('https://text.pollinations.ai/'+full);
      if(!r.ok)throw new Error('HTTP '+r.status);
      return{text:(await r.text()).trim(),fromAi:true};
    }
    if(S.aiProvider==='openrouter'||S.aiProvider==='groq'){
      const url=S.aiProvider==='openrouter'?'https://openrouter.ai/api/v1/chat/completions':'https://api.groq.com/openai/v1/chat/completions';
      const model=S.aiModel||(S.aiProvider==='openrouter'?'meta-llama/llama-3.3-70b-instruct:free':'llama-3.3-70b-versatile');
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.aiKey},body:JSON.stringify({model,messages:[{role:'system',content:'أنت راوي لعبة مستوحاة من رواية لورد الغامض. اكتب بالعربية بأسلوب غامض ومشوق.'},{role:'user',content:prompt}],max_tokens:400})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();return{text:j.choices[0].message.content.trim(),fromAi:true};
    }
    if(S.aiProvider==='gemini'){
      const model=S.aiModel||'gemini-2.0-flash';
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${S.aiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();return{text:j.candidates[0].content.parts[0].text.trim(),fromAi:true};
    }
  }catch(e){}
  return{text:localNarrate(prompt),fromAi:false};
}

// ================= GACHA =================
function rollOne(){
  const pity=S.pity;let r;
  if(pity+1>=90)r='MYTHIC';
  else{let m=3;if(pity>=70)m+=(pity-70+1)*3;const roll=Math.random()*100;
    r=roll<m?'MYTHIC':roll<m+12?'LEGENDARY':roll<m+37?'EPIC':roll<m+72?'RARE':'COMMON';}
  const pool=CARDS.filter(c=>c.r===r);return pool[Math.floor(Math.random()*pool.length)];
}
function doPull(n){
  const cost=n===1?160:1600;
  if(S.essence<cost){toast('جوهر غامض غير كافٍ! العب في العالم أو انتظر المكافأة اليومية.');return}
  S.essence-=cost;const out=[];
  for(let i=0;i<n;i++){const c=rollOne();out.push(c);S.cards[c.id]=(S.cards[c.id]||0)+1;S.pity=c.r==='MYTHIC'?0:S.pity+1;}
  save();questDone('pull',n);header();renderGacha(out);
  toast('حصلت على '+out.length+' بطاقة!');
}
function renderGacha(pulled){
  const app=document.getElementById('app');
  let h=`<div class="panel"><h1>✨ بوابة الضباب الرمادي ✨</h1><p class="dim">استدعِ شخصيات وكائنات من عالم لورد الغامض. كل استدعاء قد يغيّر مصيرك.</p><p class="dim">نسب الأسطوري: 12% | الملحمي: 25% | النادر: 35% | الشائع: 25% | الإلهي: 3% (+3% بعد 70 سحبة، مضمون عند 90)</p></div>`;
  h+=`<p style="color:var(--gold);font-weight:bold">سحبات حتى الإلهي المضمون: ${90-S.pity}</p>`;
  h+=`<div class="row"><button class="btn" onclick="doPull(1)">سحبة واحدة<br>💎 160</button><button class="btn" onclick="doPull(10)">10 سحبات<br>💎 1600</button></div>`;
  if(Date.now()-S.lastDaily>=20*3600*1000)h+=`<button class="btn alt" onclick="claimDaily()">🎁 مكافأة يومية: 300 جوهر + 100 عملة</button>`;
  if(pulled){const sorted=[...pulled].sort((a,b)=>['COMMON','RARE','EPIC','LEGENDARY','MYTHIC'].indexOf(b.r)-['COMMON','RARE','EPIC','LEGENDARY','MYTHIC'].indexOf(a.r));h+=`<h2>— نتائج الاستدعاء —</h2>`+sorted.map(c=>cardRow(c)).join('');const best=sorted[0];if(best&&(best.r==='MYTHIC'||best.r==='LEGENDARY'))h+=`<p style="color:${RARITIES[best.r].color};font-weight:bold;font-size:17px">✨ ${best.r==='MYTHIC'?'إلهي!':'أسطوري!'} حصلت على: ${best.e} ${best.n}</p>`}
  app.innerHTML=h;
}
function cardRow(c){const R=RARITIES[c.r];return `<div class="card-row rar-${c.r.toLowerCase()}" onclick="showCard('${c.id}')"><div style="flex:1"><b>${c.e} ${c.n}</b><br><span class="dim">${c.p} | تسلسل ${c.s} | ${R.ar} ${'★'.repeat(R.stars)}</span><br><span class="dim">هجوم ${c.a} | دفاع ${c.d} | صحة ${c.h}</span></div></div>`}
function claimDaily(){S.lastDaily=Date.now();S.essence+=300;S.coins+=100;save();header();toast('حصلت على المكافأة اليومية!');renderGacha()}
function showCard(id){
  const c=CARDS.find(x=>x.id===id);const R=RARITIES[c.r];const lv=cardLevel(id);const m=1+(lv-1)*0.15;
  const upBtn=lv<10?`<button class="btn" onclick="upgradeCard('${id}')">⬆️ ترقية إلى مستوى ${lv+1} (💎 ${lv*100})</button>`:`<p style="color:var(--gold)">⭐ وصلت إلى أقصى مستوى!</p>`;
  modal(`<h1>${c.e} ${c.n}</h1><p class="dim">${c.p} | تسلسل ${c.s} | <span style="color:${R.color}">${R.ar} ${'★'.repeat(R.stars)}</span> | المستوى ${lv}/10</p><p>⚔️ هجوم: ${Math.floor(c.a*m)} &nbsp; 🛡️ دفاع: ${Math.floor(c.d*m)} &nbsp; ❤️ صحة: ${Math.floor(c.h*m)} &nbsp; 🔮 روحانية: ${c.sp}</p><p style="color:var(--gold)"><b>✨ مهارة: ${c.sk} (تكلفة ${c.sc})</b></p><p class="dim">${c.sd}</p><p class="dim">📖 ${c.lore}</p>${upBtn}<p id="ai-out" class="dim"></p><button class="btn alt" onclick="cardAi('${c.id}')">🤖 توليد قصة بالذكاء الاصطناعي</button><button class="btn alt" onclick="closeModal()">إغلاق</button>`);
}
function upgradeCard(id){const lv=cardLevel(id);const cost=lv*100;if(S.essence<cost){toast('جوهر غامض غير كافٍ!');return}S.essence-=cost;S.levels[id]=lv+1;save();header();toast('تمت الترقية إلى مستوى '+(lv+1)+'!');showCard(id)}
async function cardAi(id){
  const c=CARDS.find(x=>x.id===id);const out=document.getElementById('ai-out');out.textContent='⏳ جاري التفكير...';questDone('ai');
  const r=await aiNarrate(`اكتب قصة قصيرة (3 جمل) عن ${c.n} من ${c.p}، تسلسل ${c.s}.`);
  out.textContent=(r.fromAi?'🤖 ':'📝 ')+r.text;
}

// ================= WORLD =================
function loc(){return LOCATIONS.find(l=>l.id===S.location)}
function worldSummary(){const l=loc();return `المكان: ${l.n} | المستوى: ${S.level} | العقل: ${S.sanity} | الروحانية: ${S.spirituality} | سمعة فريق الليل: ${S.repN} | سمعة كنيسة العاصفة: ${S.repS} | سمعة نادي التاروت: ${S.repT} | سمعة جماعة الفجر: ${S.repA} | سمعة الكنيسة: ${S.repC} | أعلام العالم: ${S.flags.join(',')}`}
function renderWorld(){
  const l=loc();
  let h=`<div class="panel"><h1>${l.e} أنت الآن في: ${l.n}</h1><p class="dim">${l.d}</p></div>`;
  h+=`<div class="panel"><p>🧠 العقل: ${S.sanity} | 🔮 الروحانية: ${S.spirituality}</p><p class="dim">🌙 فريق الليل: ${S.repN} | ⛈️ كنيسة العاصفة: ${S.repS}<br>🃏 نادي التاروت: ${S.repT} | 🌅 جماعة الفجر: ${S.repA} | ⛪ الكنيسة: ${S.repC}</p>${S.flags.length?`<p style="color:var(--gold)">🚩 أحداث العالم: ${S.flags.join(', ')}</p>`:''}</div>`;
  h+=`<div class="panel"><h2>🎯 المهام اليومية</h2>`+QUESTS.map(q=>{const p=questProg(q.id);const done=p>=q.target;return `<p class="dim" style="${done?'color:var(--gold)':''}">${done?'✅':'⬜'} ${q.t}: ${q.d} (${p}/${q.target}) → 💎${q.ess} 🪙${q.coins}</p>`}).join('')+`</div>`;
  h+=`<h2>🧭 السفر إلى:</h2>`+l.conn.map(id=>{const d=LOCATIONS.find(x=>x.id===id);return `<button class="btn alt" onclick="travel('${id}')">${d.e} ${d.n} (خطر ${d.danger}/10)</button>`}).join('');
  h+=`<button class="btn" onclick="showEncounter()">🔍 استكشف المنطقة (لقاء عشوائي)</button>`;
  h+=`<div class="panel"><p id="ai-world" class="dim">🤖 الراوي الذكي: اضغط الزر لوصف ما يحدث حولك الآن.</p><button class="btn" onclick="worldAi()">🤖 اسأل الراوي الذكي</button></div>`;
  h+=`<div class="row"><button class="btn alt" onclick="rest()">😴 راحة (20 عملة)</button><button class="btn alt" onclick="work()">💼 عمل (60 عملة)</button></div>`;
  document.getElementById('app').innerHTML=h;
}
function travel(id){S.location=id;S.spirituality=Math.max(0,S.spirituality-5);S.sanity=Math.max(0,S.sanity-2);save();questDone('travel');header();toast('سافرت إلى '+loc().n);renderWorld()}
function rest(){if(S.coins<20){toast('عملات غير كافية');return}S.coins-=20;S.spirituality=100;S.sanity=Math.min(100,S.sanity+20);save();header();toast('استرحت واستعدت روحانيتك.');renderWorld()}
function work(){S.coins+=60;S.spirituality=Math.max(0,S.spirituality-15);S.sanity=Math.max(0,S.sanity-5);save();header();toast('عملت وكسبت 60 عملة.');renderWorld()}
async function worldAi(){const out=document.getElementById('ai-world');out.textContent='⏳ جاري الاتصال بالذكاء الاصطناعي...';questDone('ai');const r=await aiNarrate(`صف مشهداً غامضاً يحدث الآن في ${loc().n}. ${worldSummary()}`);out.textContent=(r.fromAi?'🤖 ':'📝 ')+r.text}
function showEncounter(){
  const pool=ENCOUNTERS.filter(e=>e.loc===S.location);
  if(!pool.length){toast('لا توجد لقاءات هنا الآن. جرّب مكاناً آخر.');return}
  const enc=pool[Math.floor(Math.random()*pool.length)];
  modal(`<h1>⚡ ${enc.t}</h1><p>${enc.x}</p>`+enc.c.map((c,i)=>`<button class="choice" onclick="applyChoice(${ENCOUNTERS.indexOf(enc)},${i})">${i+1}. ${c.t}</button>`).join(''));
}
async function applyChoice(ei,ci){
  const enc=ENCOUNTERS[ei],c=enc.c[ci];
  if(c.battle){closeModal();switchScreen('battle');toast('اختر فريقك ثم ابدأ المعركة!');return}
  questDone('explore');
  S.sanity=Math.max(0,Math.min(100,S.sanity+(c.san||0)));S.spirituality=Math.max(0,Math.min(100,S.spirituality+(c.spi||0)));
  S.coins+=c.coins||0;S.essence+=c.ess||0;S.repN+=c.repN||0;S.repS+=c.repS||0;S.repT+=c.repT||0;S.repA+=c.repA||0;S.repC+=c.repC||0;
  if(c.flag&&!S.flags.includes(c.flag))S.flags.push(c.flag);
  save();header();
  modal(`<h1>📜 النتيجة</h1><p>${c.r}</p><p id="ai-out" class="dim">⏳ جاري تعليق الراوي...</p><button class="btn" onclick="closeModal();renderWorld()">متابعة</button>`);
  const r=await aiNarrate(`علق على هذا الاختيار: ${c.t}. النتيجة: ${c.r}. ${worldSummary()}`);
  const out=document.getElementById('ai-out');if(out)out.textContent=(r.fromAi?'🤖 ':'📝 ')+r.text;
}

// ================= COLLECTION =================
let filter=null;
function renderCollection(){
  const owned=Object.keys(S.cards).length;
  let h=`<h1>📚 مجموعتك: ${owned} / ${CARDS.length} بطاقة</h1>`;
  h+=`<div class="row">`+['الكل','COMMON','RARE','EPIC','LEGENDARY','MYTHIC'].map(f=>`<button class="btn alt" style="font-size:12px;padding:8px" onclick="setFilter('${f}')">${f==='الكل'?'الكل':RARITIES[f].ar}</button>`).join('')+`</div>`;
  const list=filter?CARDS.filter(c=>c.r===filter):CARDS;
  h+=`<div class="grid">`+list.map(c=>{const n=S.cards[c.id]||0;const R=RARITIES[c.r];const lv=cardLevel(c.id);
    return `<div class="cell ${n?'':'locked'}" ${n?`onclick="showCard('${c.id}')"` :''}><b>${n?c.e+' '+c.n:'❓ بطاقة مجهولة'}</b><br><span class="dim">${c.p} | تسلسل ${c.s}</span><br><span style="color:${R.color}">${R.ar} ${'★'.repeat(R.stars)}</span>${n?`<br><span class="dim">×${n} | Lv.${lv} | هجوم ${c.a}</span>`:''}</div>`}).join('')+`</div>`;
  document.getElementById('app').innerHTML=h;
}
function setFilter(f){filter=f==='الكل'?null:f;renderCollection()}

// ================= BATTLE (interactive turn-based) =================
let team=[], session=null, targetIdx=0;
function genEnemies(danger){const count=Math.max(2,Math.min(4,2+Math.floor(danger/3)));const maxIdx=Math.floor(danger/3);const pool=CARDS.filter(c=>['COMMON','RARE','EPIC','LEGENDARY'].indexOf(c.r)<=maxIdx);const out=[];for(let i=0;i<count;i++)out.push(pool[Math.floor(Math.random()*pool.length)]);return out}
function hpbar(hp,max){const f=Math.max(0,Math.min(10,Math.floor(hp*10/max)));return '█'.repeat(f)+'░'.repeat(10-f)}
function renderBattle(){
  if(session&&!session.over){renderBattleView();return}
  session=null;
  const owned=Object.keys(S.cards).map(id=>CARDS.find(c=>c.id===id)).filter(Boolean);
  let h=`<h1>⚔️ اختر فريقك (حتى 3 بطاقات): ${team.length}/3</h1>`;
  if(!owned.length){h+=`<p class="dim">لا تملك أي بطاقة بعد! اذهب إلى الاستدعاء أولاً.</p>`}
  h+=owned.map(c=>`<button class="btn ${team.includes(c.id)?'':'alt'}" onclick="toggleTeam('${c.id}')">${team.includes(c.id)?'✅':'⬜'} ${c.e} ${c.n} (${RARITIES[c.r].ar} Lv.${cardLevel(c.id)})</button>`).join('');
  h+=`<button class="btn" onclick="startBattle()">🔥 ابدأ المعركة في ${loc().n} (خطر ${loc().danger}/10)</button>`;
  document.getElementById('app').innerHTML=h;
}
function toggleTeam(id){if(team.includes(id))team=team.filter(x=>x!==id);else if(team.length<3)team.push(id);else{toast('الفريق ممتلئ (3 كحد أقصى)');return}renderBattle()}
function startBattle(){
  if(!team.length){toast('اختر بطاقة واحدة على الأقل');return}
  const players=team.map(id=>{const c=leveled(CARDS.find(x=>x.id===id));return{card:c,hp:c.h,sp:c.sp,def:false}});
  const foes=genEnemies(loc().danger).map(c=>({card:c,hp:c.h,sp:c.sp,def:false}));
  session={players,foes,log:['⚔️ بدأت المعركة! الجولة 1 — اختر إجراءً للبطاقة الأولى.'],round:1,idx:0,over:false,win:false};
  targetIdx=0;renderBattleView();
}
function alive(list){return list.filter(f=>f.hp>0)}
function renderBattleView(){
  const s=session;
  let h=`<h1>⚔️ المعركة — الجولة ${s.round}</h1>`;
  h+=`<h2>🛡️ فريقك:</h2>`+s.players.map(p=>`<p class="dim">${p.card.e} ${p.card.n}: ❤️ ${Math.max(0,p.hp)}/${p.card.h} <span class="hpbar">${hpbar(p.hp,p.card.h)}</span> 🔮 ${p.sp}</p>`).join('');
  const foes=alive(s.foes);
  h+=`<h2>👹 الأعداء (اضغط لاختيار الهدف):</h2>`+foes.map((e,i)=>`<button class="btn ${i===targetIdx?'':'alt'}" onclick="targetIdx=${i};renderBattleView()">${i===targetIdx?'🎯':'⬜'} ${e.card.e} ${e.card.n}: ❤️ ${Math.max(0,e.hp)}/${e.card.h} <span class="hpbar">${hpbar(e.hp,e.card.h)}</span></button>`).join('');
  const cur=s.players[s.idx];
  if(cur&&cur.hp>0){
    h+=`<p style="color:var(--gold)"><b>▶️ دور: ${cur.card.e} ${cur.card.n}</b></p>`;
    h+=`<div class="row"><button class="btn" onclick="act('attack')">⚔️ هجوم</button><button class="btn" onclick="act('skill')">✨ ${cur.card.sk} (${cur.card.sc}🔮)</button></div>`;
    h+=`<div class="row"><button class="btn alt" onclick="act('defend')">🛡️ دفاع (+روحانية)</button><button class="btn alt" onclick="act('flee')">🏃 هروب</button></div>`;
  }
  h+=`<div class="log">${s.log.join('\n')}</div>`;
  document.getElementById('app').innerHTML=h;
}
function act(action){
  const s=session;if(!s||s.over)return;
  const p=s.players[s.idx];if(!p||p.hp<=0){advance();return}
  if(action==='attack'){
    const foes=alive(s.foes);if(!foes.length)return finish(true);
    const t=foes[Math.max(0,Math.min(targetIdx,foes.length-1))];
    let dmg=Math.max(5,p.card.a-Math.floor(t.card.d/2));if(p.def)dmg=Math.max(1,Math.floor(dmg*0.7));
    t.hp-=dmg;s.log.push(`${p.card.e} ${p.card.n} هاجم ${t.card.n} بقوة ${dmg}!`);if(t.hp<=0)s.log.push(`💀 ${t.card.n} سقط!`);
  }else if(action==='skill'){
    if(p.sp<p.card.sc){toast(`روحانية غير كافية! (تحتاج ${p.card.sc})`);return}
    const foes=alive(s.foes);if(!foes.length)return finish(true);
    const t=foes[Math.max(0,Math.min(targetIdx,foes.length-1))];
    p.sp-=p.card.sc;let dmg=Math.max(10,Math.floor(p.card.a*p.card.pow/100)-Math.floor(t.card.d/2));if(p.def)dmg=Math.max(1,Math.floor(dmg*0.7));
    t.hp-=dmg;s.log.push(`${p.card.e} ${p.card.n} استخدم «${p.card.sk}» على ${t.card.n} بقوة ${dmg}!`);if(t.hp<=0)s.log.push(`💀 ${t.card.n} سقط!`);
  }else if(action==='defend'){
    p.def=true;p.sp=Math.min(p.card.sp,p.sp+15);s.log.push(`🛡️ ${p.card.n} اتخذ وضعية دفاعية واستعاد 15 روحانية.`);
  }else if(action==='flee'){
    if(Math.random()<0.7){s.log.push('🏃 هربت بنجاح من المعركة!');return finish(false)}
    s.log.push('❌ فشلت محاولة الهرب!');
  }
  p.def=false;targetIdx=0;advance();
}
function advance(){
  const s=session;if(s.over)return;
  if(!alive(s.foes).length)return finish(true);
  s.idx++;
  while(s.idx<s.players.length&&s.players[s.idx].hp<=0)s.idx++;
  if(s.idx>=s.players.length){
    enemyTurn();if(s.over)return;
    s.round++;s.log.push(`— الجولة ${s.round} —`);s.idx=0;
    while(s.idx<s.players.length&&s.players[s.idx].hp<=0)s.idx++;
    if(s.idx>=s.players.length)return finish(false);
  }
  if(!alive(s.players).length)finish(false);
  renderBattleView();
}
function enemyTurn(){
  const s=session;
  for(const e of alive(s.foes)){
    const targets=alive(s.players);if(!targets.length)break;
    const t=targets[Math.floor(Math.random()*targets.length)];
    if(e.sp>=e.card.sc&&Math.random()<0.5){
      e.sp-=e.card.sc;let dmg=Math.max(10,Math.floor(e.card.a*e.card.pow/100)-Math.floor(t.card.d/2));if(t.def)dmg=Math.max(1,Math.floor(dmg*0.5));
      t.hp-=dmg;s.log.push(`${e.card.e} ${e.card.n} استخدم «${e.card.sk}» على ${t.card.n} بقوة ${dmg}!`);
    }else{
      let dmg=Math.max(5,e.card.a-Math.floor(t.card.d/2));if(t.def)dmg=Math.max(1,Math.floor(dmg*0.5));
      t.hp-=dmg;s.log.push(`${e.card.e} ${e.card.n} هاجم ${t.card.n} بقوة ${dmg}!`);
    }
    if(t.hp<=0)s.log.push(`💀 ${t.card.n} سقط!`);
  }
}
function finish(win){
  const s=session;s.over=true;s.win=win;
  s.log.push(win?'🏆 انتصار!':'💔 هزيمة...');
  const coins=win?80+s.foes.length*40+Math.floor(Math.random()*60):20;
  const ess=win?50+s.foes.length*30:10;
  const xp=win?40+s.foes.length*25:10;
  S.coins+=coins;S.essence+=ess;S.xp+=xp;
  while(S.xp>=S.level*100){S.xp-=S.level*100;S.level++;S.essence+=200}
  if(win)questDone('battle');
  save();header();session=null;
  modal(`<h1>${win?'🏆 انتصار!':'💔 هزيمة'}</h1><div class="log">${s.log.join('\n')}</div><p style="color:var(--gold)"><b>المكافأة: ${coins} عملة | ${ess} جوهر | ${xp} خبرة</b></p><button class="btn" onclick="closeModal();renderBattle()">إغلاق</button>`);
}

  <select id="ai-provider">${provs.map(p=>`<option value="${p[0]}" ${S.aiProvider===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select>

  <p id="ai-test" class="dim"></p></div>
  <div class="panel"><h2 style="color:#ff5252">🗑️ منطقة الخطر</h2><button class="btn danger" onclick="if(confirm('حذف كل التقدم؟')){localStorage.removeItem('lotm_save');location.reload()}">حذف كل التقدم</button></div>
  <div class="panel"><h2>ℹ️ عن اللعبة</h2><p class="dim">لعبة بطاقات غاتشا نصية بعالم مفتوح مستوحاة من رواية «لورد الغامض» (Lord of the Mysteries) للكاتب Cuttlefish That Loves Diving. مشروع معجبين غير تجاري. جميع الشخصيات والأسماء ملك لأصحابها الأصليين.<br><br>الميزات: استدعاء غاتشا بنظام الشفقة، عالم مفتوح باختيارات تغيّر العالم، معارك بطاقات تفاعلية، ترقية البطاقات، مهام يومية، وراوي ذكاء اصطناعي مجاني يولّد القصص.</p></div>`;
}
function saveAi(){S.aiProvider=document.getElementById('ai-provider').value;S.aiModel=document.getElementById('ai-model').value.trim();S.aiKey=document.getElementById('ai-key').value.trim();save();toast('تم الحفظ!')}
async function testAi(){const out=document.getElementById('ai-test');out.textContent='⏳ جاري الاختبار...';const r=await aiNarrate('قل مرحباً بجملة واحدة قصيرة.');out.textContent=(r.fromAi?'✅ متصل بالذكاء الاصطناعي: ':'📝 وضع محلي: ')+r.text}

// ================= NAV =================
function switchScreen(s){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===s));
  if(s==='gacha')renderGacha();else if(s==='world')renderWorld();else if(s==='collection')renderCollection();else if(s==='battle')renderBattle();else renderSettings();
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>switchScreen(b.dataset.s)));
header();renderGacha();
</script>
