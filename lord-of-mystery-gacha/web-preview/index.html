  .stars{color:var(--gold)}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;padding:10px 18px;border-radius:20px;font-weight:bold;z-index:30;display:none}

// ================= AI (Pollinations free + local fallback) =================
const LOCAL_LINES=['الضباب الرمادي يتحرك حولك كأن العالم نفسه يراقبك. تشعر أن كل خطوة تخطوها تغيّر شيئاً في هذا العالم الغامض.','في مكان ما بعيد، يبتسم الأحمق خلف حجاب الغموض. مصيرك يتشكل الآن، وكل اختيار تفعله يترك أثراً.','الرياح تحمل همسات من الماضي. تسمع صوتاً يقول إن الطريق أمامك طويل، لكن من يملك الشجاعة يصل إلى النهاية.','تشعر بقوة روحانية تسري في جسدك. العالم من حولك يتغير ببطء، وكل شيء يبدو ممكناً الآن.','من بعيد، ترى نوراً خافتاً. إنه نور الأمل في عالم مليء بالظلام والأسرار.'];
function localNarrate(p){return LOCAL_LINES[Math.abs(p.split('').reduce((a,c)=>a+c.charCodeAt(0),0))%LOCAL_LINES.length]}
async function aiNarrate(prompt){
  if(S.aiProvider==='local')return{text:localNarrate(prompt),fromAi:false};
  try{
    if(S.aiProvider==='pollinations'){
      const full=encodeURIComponent('أنت راوي لعبة مستوحاة من رواية لورد الغامض. اكتب بالعربية بأسلوب غامض ومشوق (3-5 جمل). '+prompt);
      const r=await fetch('https://text.pollinations.ai/'+full);
      if(!r.ok)throw new Error('HTTP '+r.status);
      return{text:(await r.text()).trim(),fromAi:true};
    }
    if(S.aiProvider==='openrouter'||S.aiProvider==='groq'){
      const url=S.aiProvider==='openrouter'?'https://openrouter.ai/api/v1/chat/completions':'https://api.groq.com/openai/v1/chat/completions';
      const model=S.aiModel||(S.aiProvider==='openrouter'?'meta-llama/llama-3.3-70b-instruct:free':'llama-3.3-70b-versatile');
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.aiKey},body:JSON.stringify({model,messages:[{role:'system',content:'أنت راوي لعبة مستوحاة من رواية لورد الغامض. اكتب بالعربية بأسلوب غامض ومشوق.'},{role:'user',content:prompt}],max_tokens:400})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();return{text:j.choices[0].message.content.trim(),fromAi:true};
    }
    if(S.aiProvider==='gemini'){
      const model=S.aiModel||'gemini-2.0-flash';
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${S.aiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();return{text:j.candidates[0].content.parts[0].text.trim(),fromAi:true};
    }
  }catch(e){}
  return{text:localNarrate(prompt),fromAi:false};
}

// ================= GACHA =================
function rollOne(){
  const pity=S.pity;let r;
  if(pity+1>=90)r='MYTHIC';
  else{let m=3;if(pity>=70)m+=(pity-70+1)*3;const roll=Math.random()*100;
    r=roll<m?'MYTHIC':roll<m+12?'LEGENDARY':roll<m+37?'EPIC':roll<m+72?'RARE':'COMMON';}
  const pool=CARDS.filter(c=>c.r===r);return pool[Math.floor(Math.random()*pool.length)];
}
function doPull(n){
  const cost=n===1?160:1600;
  if(S.essence<cost){toast('جوهر غامض غير كافٍ! العب في العالم أو انتظر المكافأة اليومية.');return}
  S.essence-=cost;const out=[];
  for(let i=0;i<n;i++){const c=rollOne();out.push(c);S.cards[c.id]=(S.cards[c.id]||0)+1;S.pity=c.r==='MYTHIC'?0:S.pity+1;}
  save();header();renderGacha(out);
  toast('حصلت على '+out.length+' بطاقة!');
}
function renderGacha(pulled){
  const app=document.getElementById('app');
  let h=`<div class="panel"><h1>✨ بوابة الضباب الرمادي ✨</h1><p class="dim">استدعِ شخصيات وكائنات من عالم لورد الغامض. كل استدعاء قد يغيّر مصيرك.</p><p class="dim">نسب الأسطوري: 12% | الملحمي: 25% | النادر: 35% | الشائع: 25% | الإلهي: 3% (+3% بعد 70 سحبة، مضمون عند 90)</p></div>`;
  h+=`<p style="color:var(--gold);font-weight:bold">سحبات حتى الإلهي المضمون: ${90-S.pity}</p>`;
  h+=`<div class="row"><button class="btn" onclick="doPull(1)">سحبة واحدة<br>💎 160</button><button class="btn" onclick="doPull(10)">10 سحبات<br>💎 1600</button></div>`;
  if(Date.now()-S.lastDaily>=20*3600*1000)h+=`<button class="btn alt" onclick="claimDaily()">🎁 مكافأة يومية: 300 جوهر + 100 عملة</button>`;
  if(pulled)h+=`<h2>— نتائج الاستدعاء —</h2>`+pulled.map(c=>cardRow(c)).join('');
  app.innerHTML=h;
}
function cardRow(c){const R=RARITIES[c.r];return `<div class="card-row rar-${c.r.toLowerCase()}" onclick="showCard('${c.id}')"><div style="flex:1"><b>${c.e} ${c.n}</b><br><span class="dim">${c.p} | تسلسل ${c.s} | ${R.ar} ${'★'.repeat(R.stars)}</span><br><span class="dim">هجوم ${c.a} | دفاع ${c.d} | صحة ${c.h}</span></div></div>`}
function claimDaily(){S.lastDaily=Date.now();S.essence+=300;S.coins+=100;save();header();toast('حصلت على المكافأة اليومية!');renderGacha()}
function showCard(id){
  const c=CARDS.find(x=>x.id===id);const R=RARITIES[c.r];
  modal(`<h1>${c.e} ${c.n}</h1><p class="dim">${c.p} | تسلسل ${c.s} | <span style="color:${R.color}">${R.ar} ${'★'.repeat(R.stars)}</span></p><p>⚔️ هجوم: ${c.a} &nbsp; 🛡️ دفاع: ${c.d} &nbsp; ❤️ صحة: ${c.h} &nbsp; 🔮 روحانية: ${c.sp}</p><p style="color:var(--gold)"><b>✨ مهارة: ${c.sk} (تكلفة ${c.sc})</b></p><p class="dim">${c.sd}</p><p class="dim">📖 ${c.lore}</p><p id="ai-out" class="dim"></p><button class="btn" onclick="cardAi('${c.id}')">🤖 توليد قصة بالذكاء الاصطناعي</button><button class="btn alt" onclick="closeModal()">إغلاق</button>`);
}
async function cardAi(id){
  const c=CARDS.find(x=>x.id===id);const out=document.getElementById('ai-out');out.textContent='⏳ جاري التفكير...';
  const r=await aiNarrate(`اكتب قصة قصيرة (3 جمل) عن ${c.n} من ${c.p}، تسلسل ${c.s}.`);
  out.textContent=(r.fromAi?'🤖 ':'📝 ')+r.text;
}

function travel(id){S.location=id;S.spirituality=Math.max(0,S.spirituality-5);S.sanity=Math.max(0,S.sanity-2);save();header();toast('سافرت إلى '+loc().n);renderWorld()}

function showEncounter(){
  const pool=ENCOUNTERS.filter(e=>e.loc===S.location);
  if(!pool.length){toast('لا توجد لقاءات هنا الآن. جرّب مكاناً آخر.');return}
  const enc=pool[Math.floor(Math.random()*pool.length)];
  modal(`<h1>⚡ ${enc.t}</h1><p>${enc.x}</p>`+enc.c.map((c,i)=>`<button class="choice" onclick="applyChoice(${ENCOUNTERS.indexOf(enc)},${i})">${i+1}. ${c.t}</button>`).join(''));
}
async function applyChoice(ei,ci){
  const enc=ENCOUNTERS[ei],c=enc.c[ci];
  if(c.battle){closeModal();switchScreen('battle');toast('اختر فريقك ثم ابدأ المعركة!');return}
  S.sanity=Math.max(0,Math.min(100,S.sanity+(c.san||0)));S.spirituality=Math.max(0,Math.min(100,S.spirituality+(c.spi||0)));
  S.coins+=c.coins||0;S.essence+=c.ess||0;S.repN+=c.repN||0;S.repS+=c.repS||0;S.repT+=c.repT||0;S.repA+=c.repA||0;S.repC+=c.repC||0;
  if(c.flag&&!S.flags.includes(c.flag))S.flags.push(c.flag);
  save();header();
  modal(`<h1>📜 النتيجة</h1><p>${c.r}</p><p id="ai-out" class="dim">⏳ جاري تعليق الراوي...</p><button class="btn" onclick="closeModal();renderWorld()">متابعة</button>`);
  const r=await aiNarrate(`علق على هذا الاختيار: ${c.t}. النتيجة: ${c.r}. ${worldSummary()}`);
  const out=document.getElementById('ai-out');if(out)out.textContent=(r.fromAi?'🤖 ':'📝 ')+r.text;
}

// ================= COLLECTION =================
let filter=null;
function renderCollection(){
  const owned=Object.keys(S.cards).length;
  let h=`<h1>📚 مجموعتك: ${owned} / ${CARDS.length} بطاقة</h1>`;
  h+=`<div class="row">`+['الكل','COMMON','RARE','EPIC','LEGENDARY','MYTHIC'].map(f=>`<button class="btn alt" style="font-size:12px;padding:8px" onclick="setFilter('${f}')">${f==='الكل'?'الكل':RARITIES[f].ar}</button>`).join('')+`</div>`;
  const list=filter?CARDS.filter(c=>c.r===filter):CARDS;
  h+=`<div class="grid">`+list.map(c=>{const n=S.cards[c.id]||0;const R=RARITIES[c.r];
    return `<div class="cell ${n?'':'locked'}" ${n?`onclick="showCard('${c.id}')"` :''}><b>${n?c.e+' '+c.n:'❓ بطاقة مجهولة'}</b><br><span class="dim">${c.p} | تسلسل ${c.s}</span><br><span style="color:${R.color}">${R.ar} ${'★'.repeat(R.stars)}</span>${n?`<br><span class="dim">×${n} | هجوم ${c.a}</span>`:''}</div>`}).join('')+`</div>`;
  document.getElementById('app').innerHTML=h;
}
function setFilter(f){filter=f==='الكل'?null:f;renderCollection()}

// ================= BATTLE =================
let team=[];
function renderBattle(){
  const owned=Object.keys(S.cards).map(id=>CARDS.find(c=>c.id===id)).filter(Boolean);
  let h=`<h1>⚔️ اختر فريقك (حتى 3 بطاقات): ${team.length}/3</h1>`;
  if(!owned.length){h+=`<p class="dim">لا تملك أي بطاقة بعد! اذهب إلى الاستدعاء أولاً.</p>`}
  h+=owned.map(c=>`<button class="btn ${team.includes(c.id)?'':'alt'}" onclick="toggleTeam('${c.id}')">${team.includes(c.id)?'✅':'⬜'} ${c.e} ${c.n} (${RARITIES[c.r].ar})</button>`).join('');
  h+=`<button class="btn" onclick="fight()">🔥 ابدأ المعركة في ${loc().n} (خطر ${loc().danger}/10)</button>`;
  document.getElementById('app').innerHTML=h;
}
function toggleTeam(id){if(team.includes(id))team=team.filter(x=>x!==id);else if(team.length<3)team.push(id);else{toast('الفريق ممتلئ (3 كحد أقصى)');return}renderBattle()}
function genEnemies(danger){const count=Math.max(2,Math.min(4,2+Math.floor(danger/3)));const maxIdx=Math.floor(danger/3);const pool=CARDS.filter(c=>['COMMON','RARE','EPIC','LEGENDARY'].indexOf(c.r)<=maxIdx);const out=[];for(let i=0;i<count;i++)out.push(pool[Math.floor(Math.random()*pool.length)]);return out}
function fight(){
  if(!team.length){toast('اختر بطاقة واحدة على الأقل');return}
  const players=team.map(id=>{const c=CARDS.find(x=>x.id===id);return{card:c,hp:c.h,sp:c.sp}});
  const foes=genEnemies(loc().danger).map(c=>({card:c,hp:c.h,sp:c.sp}));
  const log=['⚔️ بدأت المعركة!'];
  let round=0;
  while(players.some(p=>p.hp>0)&&foes.some(f=>f.hp>0)&&round<30){
    round++;log.push(`— الجولة ${round} —`);
    for(const p of players.filter(p=>p.hp>0)){
      const t=foes.filter(f=>f.hp>0);if(!t.length)break;const target=t[Math.floor(Math.random()*t.length)];
      if(p.sp>=p.card.sc&&Math.random()<0.6){p.sp-=p.card.sc;const dmg=Math.max(10,Math.floor(p.card.a*p.card.pow/100)-Math.floor(target.card.d/2));target.hp-=dmg;log.push(`${p.card.e} ${p.card.n} استخدم «${p.card.sk}» على ${target.card.n} بقوة ${dmg}!`)}
      else{const dmg=Math.max(5,p.card.a-Math.floor(target.card.d/2));target.hp-=dmg;log.push(`${p.card.e} ${p.card.n} هاجم ${target.card.n} بقوة ${dmg}.`)}
      if(target.hp<=0)log.push(`💀 ${target.card.n} سقط!`);
    }
    if(!foes.some(f=>f.hp>0))break;
    for(const e of foes.filter(f=>f.hp>0)){
      const t=players.filter(p=>p.hp>0);if(!t.length)break;const target=t[Math.floor(Math.random()*t.length)];
      if(e.sp>=e.card.sc&&Math.random()<0.5){e.sp-=e.card.sc;const dmg=Math.max(10,Math.floor(e.card.a*e.card.pow/100)-Math.floor(target.card.d/2));target.hp-=dmg;log.push(`${e.card.e} ${e.card.n} استخدم «${e.card.sk}» على ${target.card.n} بقوة ${dmg}!`)}
      else{const dmg=Math.max(5,e.card.a-Math.floor(target.card.d/2));target.hp-=dmg;log.push(`${e.card.e} ${e.card.n} هاجم ${target.card.n} بقوة ${dmg}.`)}
      if(target.hp<=0)log.push(`💀 ${target.card.n} سقط!`);
    }
  }
  const win=!foes.some(f=>f.hp>0);
  const coins=win?80+foes.length*40+Math.floor(Math.random()*60):20;
  const ess=win?50+foes.length*30:10;
  const xp=win?40+foes.length*25:10;
  S.coins+=coins;S.essence+=ess;S.xp+=xp;
  while(S.xp>=S.level*100){S.xp-=S.level*100;S.level++;S.essence+=200}
  save();header();
  log.push(win?`🏆 انتصار! حصلت على ${coins} عملة و${ess} جوهر غامض.`:`💔 هزيمة... لكنك حصلت على ${coins} عملة كتعويض.`);
  modal(`<h1>${win?'🏆 انتصار!':'💔 هزيمة'}</h1><div class="log">${log.join('\n')}</div><p style="color:var(--gold)"><b>المكافأة: ${coins} عملة | ${ess} جوهر | ${xp} خبرة</b></p><button class="btn" onclick="closeModal();renderBattle()">إغلاق</button>`);
}

// ================= SETTINGS =================
function renderSettings(){
  const provs=[['local','محلي (دون إنترنت)'],['pollinations','Pollinations (مجاني، بدون مفتاح)'],['openrouter','OpenRouter (نماذج مجانية)'],['groq','Groq (مجاني)'],['gemini','Gemini (مجاني)']];
  document.getElementById('app').innerHTML=`
  <h1>⚙️ الإعدادات</h1>
  <div class="panel"><h2>🤖 الراوي الذكي (نماذج مجانية)</h2><p class="dim">اختر مزود الذكاء الاصطناعي الذي يولّد القصص والحوارات:</p>
  <select id="ai-provider">${provs.map(p=>`<option value="${p[0]}" ${S.aiProvider===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select>
  <input id="ai-model" placeholder="اسم النموذج (اختياري)" value="${S.aiModel||''}">
  <input id="ai-key" placeholder="مفتاح API (اختياري لـ Pollinations)" value="${S.aiKey||''}">
  <button class="btn" onclick="saveAi()">💾 حفظ إعدادات الذكاء الاصطناعي</button>
  <button class="btn alt" onclick="testAi()">🔌 اختبار الاتصال</button>
  <p id="ai-test" class="dim"></p></div>
  <div class="panel"><h2 style="color:#ff5252">🗑️ منطقة الخطر</h2><button class="btn danger" onclick="if(confirm('حذف كل التقدم؟')){localStorage.removeItem('lotm_save');location.reload()}">حذف كل التقدم</button></div>
  <div class="panel"><h2>ℹ️ عن اللعبة</h2><p class="dim">لعبة بطاقات غاتشا نصية بعالم مفتوح مستوحاة من رواية «لورد الغامض» (Lord of the Mysteries) للكاتب Cuttlefish That Loves Diving. مشروع معجبين غير تجاري. جميع الشخصيات والأسماء ملك لأصحابها الأصليين.<br><br>الميزات: استدعاء غاتشا بنظام الشفقة، عالم مفتوح باختيارات تغيّر العالم، معارك بطاقات، وراوي ذكاء اصطناعي مجاني يولّد القصص.</p></div>`;
}
function saveAi(){S.aiProvider=document.getElementById('ai-provider').value;S.aiModel=document.getElementById('ai-model').value.trim();S.aiKey=document.getElementById('ai-key').value.trim();save();toast('تم الحفظ!')}
async function testAi(){const out=document.getElementById('ai-test');out.textContent='⏳ جاري الاختبار...';const r=await aiNarrate('قل مرحباً بجملة واحدة قصيرة.');out.textContent=(r.fromAi?'✅ متصل بالذكاء الاصطناعي: ':'📝 وضع محلي: ')+r.text}

// ================= NAV =================
function switchScreen(s){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===s));
  if(s==='gacha')renderGacha();else if(s==='world')renderWorld();else if(s==='collection')renderCollection();else if(s==='battle')renderBattle();else renderSettings();
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>switchScreen(b.dataset.s)));
header();renderGacha();
</script>
</body>
